<!DOCTYPE html>
<html lang="en">
  <head>
    <title>TÜK Variant Browser</title>
    <meta charset="utf-8" />
    <meta
      name="description"
      content="Tartu Ülikooli Kliinikum Clinical Variant Browser for local cohort variant and gene-level queries."
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/normalize/7.0.0/normalize.min.css"
    />

    <link
      rel="search"
      href="/opensearch.xml"
      type="application/opensearchdescription+xml"
      title="TÜK Variant Browser"
    />

    <style>
      html,
      body {
        min-height: 100%;
        width: 100%;
        background-color: #ffffff;
        font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 16px;
      }

      @media print {
        html,
        body {
          background: none;
        }
      }

      #root {
        padding-bottom: 1px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <% if (htmlWebpackPlugin.options.gaTrackingId) { %>
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=<%= htmlWebpackPlugin.options.gaTrackingId %>"
    ></script>
    <script>
      window.gaTrackingId = '<%= htmlWebpackPlugin.options.gaTrackingId %>'
      window.dataLayer = window.dataLayer || []
      function gtag() {
        dataLayer.push(arguments)
      }
      gtag('js', new Date())

      gtag('config', '<%= htmlWebpackPlugin.options.gaTrackingId %>', {
        send_page_view: false,
      })
      window.gtag = gtag
    </script>
    <% } %>
  </body>
</html>
